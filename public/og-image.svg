<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0d2e"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="amber-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="glow-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.18"/>
    </linearGradient>
    <linearGradient id="glow-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glow blobs -->
  <circle cx="1050" cy="200" r="300" fill="url(#glow-right)" filter="url(#blur)"/>
  <circle cx="150" cy="430" r="250" fill="url(#glow-left)" filter="url(#blur)"/>

  <!-- Dot grid pattern -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.04)"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Left accent bar -->
  <rect x="60" y="120" width="4" height="390" rx="2" fill="url(#amber-blue)"/>

  <!-- Logo area -->
  <rect x="90" y="130" width="52" height="52" rx="14" fill="url(#amber-blue)"/>
  <text x="116" y="163" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="white" text-anchor="middle">H</text>

  <!-- Brand name -->
  <text x="160" y="168" font-family="Arial Black, sans-serif" font-size="28" font-weight="700" fill="white" letter-spacing="1">HuruLearn</text>

  <!-- Main headline -->
  <text x="90" y="270" font-family="Arial Black, sans-serif" font-size="68" font-weight="900" fill="white">AI-Powered</text>
  <text x="90" y="350" font-family="Arial Black, sans-serif" font-size="68" font-weight="900" fill="url(#amber-blue)">SMS Education</text>
  <text x="90" y="430" font-family="Arial Black, sans-serif" font-size="68" font-weight="900" fill="white">for Africa</text>

  <!-- Tagline -->
  <text x="90" y="500" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.55)">No internet. No smartphone. Just knowledge.</text>

  <!-- SMS code badge -->
  <rect x="90" y="530" width="320" height="48" rx="12" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.4)" stroke-width="1.5"/>
  <text x="250" y="560" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fcd34d" text-anchor="middle">Text HURU to 15054</text>

  <!-- Phone mockup (right side) -->
  <rect x="850" y="100" width="240" height="430" rx="28" fill="#0a0820" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <rect x="900" y="118" width="140" height="8" rx="4" fill="#1a1630"/>

  <!-- SMS bubbles in mockup -->
  <rect x="868" y="148" width="180" height="62" rx="12" fill="rgba(255,255,255,0.07)"/>
  <text x="878" y="168" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">Student · +255 7XX XXX</text>
  <text x="878" y="185" font-family="Arial, sans-serif" font-size="12" fill="white">HURU photosynthesis?</text>
  <text x="878" y="200" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.3)">20:14</text>

  <rect x="868" y="226" width="180" height="120" rx="12" fill="rgba(59,130,246,0.85)"/>
  <text x="878" y="246" font-family="Arial, sans-serif" font-size="11" fill="white">Photosynthesis converts</text>
  <text x="878" y="261" font-family="Arial, sans-serif" font-size="11" fill="white">sunlight + water + CO₂</text>
  <text x="878" y="276" font-family="Arial, sans-serif" font-size="11" fill="white">into glucose + oxygen.</text>
  <text x="878" y="295" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)">6CO₂+6H₂O→C₆H₁₂O₆+6O₂</text>
  <text x="878" y="334" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">20:14 ✓✓</text>

  <!-- Signal on top of phone -->
  <circle cx="870" cy="380" r="3" fill="rgba(20,184,166,0.8)"/>
  <circle cx="877" cy="380" r="3" fill="rgba(20,184,166,0.8)"/>
  <circle cx="884" cy="380" r="3" fill="rgba(20,184,166,0.4)"/>

  <!-- Stats row at bottom right -->
  <text x="870" y="430" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.4)">Bilingual · English + Kiswahili</text>
  <text x="870" y="450" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.4)">Powered by Google Gemini AI</text>

  <!-- Website URL bottom -->
  <text x="600" y="605" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.3)" text-anchor="middle">hurulearn.hurudigital.co.tz</text>
</svg>
